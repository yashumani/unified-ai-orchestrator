name: Fixture CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: fixture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public fixture verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify public fixtures and production build
        run: npm run verify

      - name: Qualify deterministic application and recovery artifacts
        shell: pwsh
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $firstApp = Join-Path $env:RUNNER_TEMP "application-first.zip"
          $secondApp = Join-Path $env:RUNNER_TEMP "application-second.zip"
          $firstController = Join-Path $env:RUNNER_TEMP "controller-first.zip"
          $secondController = Join-Path $env:RUNNER_TEMP "controller-second.zip"
          ./scripts/release/New-ReleaseArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $firstApp
          ./scripts/release/New-ReleaseArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $secondApp
          ./scripts/release/New-RecoveryControllerArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $firstController
          ./scripts/release/New-RecoveryControllerArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $secondController
          foreach ($pair in @(
              @($firstApp, $secondApp),
              @($firstController, $secondController)
            )) {
            $firstHash = (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash
            $secondHash = (Get-FileHash -LiteralPath $pair[1] -Algorithm SHA256).Hash
            if ($firstHash -cne $secondHash) {
              throw "Release artifact creation is not deterministic."
            }
          }
