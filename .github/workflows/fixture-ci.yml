name: Fixture CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: fixture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public fixture verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify public fixtures and production build
        run: npm run verify

      - name: Qualify deterministic application and recovery artifacts
        shell: pwsh
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $firstApp = Join-Path $env:RUNNER_TEMP "application-first.zip"
          $secondApp = Join-Path $env:RUNNER_TEMP "application-second.zip"
          $firstController = Join-Path $env:RUNNER_TEMP "controller-first.zip"
          $secondController = Join-Path $env:RUNNER_TEMP "controller-second.zip"
          $staleMarkerRelative = "apps/api/dist/stale-release-marker.txt"
          $staleMarker = Join-Path $env:GITHUB_WORKSPACE $staleMarkerRelative
          New-Item -ItemType Directory -Path (Split-Path -Parent $staleMarker) -Force | Out-Null
          Set-Content -LiteralPath $staleMarker -Value "must-not-ship" -NoNewline
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            & (Join-Path $env:GITHUB_WORKSPACE "scripts/release/New-ReleaseArtifact.ps1") `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -CommitSha $env:CHECKOUT_SHA `
              -OutputPath $firstApp
          }
          finally {
            Pop-Location
          }
          if (Test-Path -LiteralPath $staleMarker) {
            throw "Release source build retained a stale generated output."
          }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($firstApp)
          try {
            if (@($archive.Entries | Where-Object { $_.FullName -ceq $staleMarkerRelative }).Count -ne 0) {
              throw "Release archive retained a stale generated output."
            }
          }
          finally {
            $archive.Dispose()
          }
          ./scripts/release/New-ReleaseArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $secondApp
          ./scripts/release/New-RecoveryControllerArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $firstController
          ./scripts/release/New-RecoveryControllerArtifact.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -CommitSha $env:CHECKOUT_SHA `
            -OutputPath $secondController
          foreach ($pair in @(
              @($firstApp, $secondApp),
              @($firstController, $secondController)
            )) {
            $firstHash = (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash
            $secondHash = (Get-FileHash -LiteralPath $pair[1] -Algorithm SHA256).Hash
            if ($firstHash -cne $secondHash) {
              throw "Release artifact creation is not deterministic."
            }
          }
