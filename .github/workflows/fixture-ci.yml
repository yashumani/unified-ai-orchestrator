name: Fixture CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: fixture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public fixture verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify public fixtures and production build
        run: npm run verify
